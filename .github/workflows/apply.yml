name: Terraform Infrastructure Deploy

on:
  push:

env:
  AWS_REGION: ap-south-1


jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:

    
    - name: Checkout Code
      uses: actions/checkout@v4

    
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}


    
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4

    
    - name: Terraform Init
      run: terraform init


    - name: Terraform Plan
      run: terraform plan 

    - name: Terraform Apply
      run: terraform apply -auto-approve

      # Trigger Backend Repo
    - name: Trigger Backend Deployment
      run: |
        curl -X POST \
        -H "Accept: application/vnd.github+json" \
        -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
        https://api.github.com/repos/pratikgayakwad07/Backend-Amazona/dispatches \
        -d '{"event_type":"backend_deploy"}'
      # Trigger Frontend Repo
    - name: Trigger Frontend Deployment
      run: |
        curl -X POST \
        -H "Accept: application/vnd.github+json" \
        -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
        https://api.github.com/repos/pratikgayakwad07/Frontend-Amazona/dispatches \
        -d '{"event_type":"frontend_deploy"}'